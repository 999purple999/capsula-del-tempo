  </div>

  <!-- ULTRA TIMER -->
  <div class="timer-wrap" aria-label="Countdown timer">
    <div class="timer-display" id="timer-display">

      <!-- ANNI -->
      <div class="tu tu--years">
        <div class="td-wrap">
          <div class="scanline"></div>
          <span class="td" id="timer-years" aria-label="anni">09</span>
        </div>
        <span class="tl" data-i18n="timer.years">ANNI</span>
      </div>

      <span class="t-dot" aria-hidden="true">·</span>

      <!-- GIORNI -->
      <div class="tu tu--days">
        <div class="td-wrap">
          <div class="scanline"></div>
          <span class="td" id="timer-days" aria-label="giorni">364</span>
        </div>
        <span class="tl" data-i18n="timer.days">GIORNI</span>
      </div>

      <span class="t-colon" aria-hidden="true">:</span>

      <!-- ORE -->
      <div class="tu">
        <div class="td-wrap">
          <div class="scanline"></div>
          <span class="td" id="timer-hours" aria-label="ore">23</span>

      <span class="t-colon" aria-hidden="true">:</span>

          <div class="scanline"></div>
          <span class="td" id="timer-seconds" aria-label="secondi">59</span>
        </div>
        <span class="tl" data-i18n="timer.seconds">SECONDI</span>
      </div>

    </div>
  </div>

  <p class="release-phrase" data-i18n="pre.phrase">Il futuro si conserva nel codice.
Il passato si rivela al momento giusto.</p>
