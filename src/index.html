  <style>
/* ================================================================
   DESIGN SYSTEM — TIME CAPSULE 5B INF ITIS Q. SELLA
   ================================================================ */

:root {
  --void:             #000000;
  --surface:          #03050a;
  --surface-2:        #080c10;
  --matrix:           #00ff41;
  --matrix-dim:       #00cc35;
  --matrix-deep:      #004d18;
  --matrix-ghost:     rgba(0,255,65,.06);
  --matrix-glow:      rgba(0,255,65,.35);
  --matrix-glow-sm:   rgba(0,255,65,.18);
  --text-primary:     #e4eae4;
  --text-secondary:   #7a9080;
  --text-muted:       #2a3830;
  --text-accent:      #00ff41;
  --border:           rgba(0,255,65,.10);
  --border-bright:    rgba(0,255,65,.28);
  --border-line:      rgba(0,255,65,.06);
  --font-mono:        'Share Tech Mono','Space Mono','Courier New',monospace;
  --font-sans:        'Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;
  --t-fast:           .18s ease;
  --t-mid:            .5s cubic-bezier(.4,0,.2,1);
  --t-slow:           1.1s cubic-bezier(.4,0,.2,1);
  --t-reveal:         1.4s cubic-bezier(.16,1,.3,1);
  --timer-sz:         clamp(3.5rem,10vw,7.5rem);
  --max-w:            1160px;
  --section-py:       clamp(5rem,10vh,8rem);
}

/* ── RESET ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{
  background:var(--void);
  color:var(--text-primary);
  font-family:var(--font-sans);
  line-height:1.6;
  overflow-x:hidden;
  min-height:100vh;
}
button{cursor:pointer}
a{color:inherit;text-decoration:none}

/* ── MATRIX CANVAS ── */
#matrix-canvas{
  position:fixed;top:0;left:0;
  width:100%;height:100%;
  z-index:0;pointer-events:none;
  opacity:.4;transition:opacity 2s ease;
}

/* ── SCANLINES ── */
body::after{
  content:'';position:fixed;inset:0;z-index:999;pointer-events:none;
  background:repeating-linear-gradient(
    0deg,transparent,transparent 2px,
    rgba(0,0,0,.028) 2px,rgba(0,0,0,.028) 4px
  );
}

/* ── LANG SWITCH ── */
.lang-switch{
  position:fixed;top:1.25rem;right:1.5rem;
  z-index:900;display:flex;
  border:1px solid var(--border-bright);
  border-radius:2px;overflow:hidden;
}
.lang-btn{
  background:transparent;border:none;
  color:var(--text-secondary);
  font-family:var(--font-mono);font-size:.68rem;
  letter-spacing:.12em;padding:.4rem .75rem;
  transition:all var(--t-fast);
}
.lang-btn.active{background:var(--matrix);color:var(--void);font-weight:bold}
.lang-btn:hover:not(.active){background:var(--matrix-ghost);color:var(--matrix)}
.lang-btn:focus-visible{outline:1px solid var(--matrix);outline-offset:2px}

/* ================================================================
   PRE-RELEASE STATE
   ================================================================ */
#pre-release{
  position:relative;z-index:10;
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:2rem 1.5rem 4rem;
  text-align:center;
}

/* Logo */
.capsule-logo{
  width:clamp(52px,8vw,76px);
  height:auto;margin-bottom:2.5rem;
  opacity:.85;
}

/* Label */
.capsule-label{
  font-family:var(--font-mono);
  font-size:clamp(.6rem,1.2vw,.75rem);
  letter-spacing:.38em;color:var(--text-muted);
  text-transform:uppercase;margin-bottom:.6rem;
}

/* Title */
.capsule-title{
  font-family:var(--font-sans);
  font-size:clamp(1.9rem,5.5vw,4rem);
  font-weight:700;letter-spacing:-.025em;
  line-height:1.05;color:var(--text-primary);
  margin-bottom:.6rem;
}
.capsule-title span{
  display:block;
  font-size:clamp(1rem,2.5vw,1.8rem);
  font-weight:300;color:var(--text-secondary);
  letter-spacing:.08em;
}

/* Status bar */
.status-bar{
  display:flex;align-items:center;gap:.6rem;
  font-family:var(--font-mono);font-size:.62rem;
  letter-spacing:.22em;color:var(--matrix-dim);
  margin:2rem 0 2.5rem;
}
.status-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--matrix);
  box-shadow:0 0 8px var(--matrix),0 0 16px var(--matrix-glow-sm);
  animation:dot-pulse 2.2s ease-in-out infinite;
  flex-shrink:0;
}
@keyframes dot-pulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(.7);opacity:.35}
}

/* ═══════════════════════════════════════════
   ULTRA TIMER
   ═══════════════════════════════════════════ */
.timer-wrap{
  margin-bottom:2.8rem;
  animation:timer-breathe 5s ease-in-out infinite;
}
@keyframes timer-breathe{
  0%,100%{filter:brightness(1) drop-shadow(0 0 0px transparent)}
  50%{filter:brightness(1.06) drop-shadow(0 0 24px rgba(0,255,65,.12))}
}

.timer-display{
  display:flex;align-items:center;
  justify-content:center;
  gap:.35rem;flex-wrap:wrap;
  row-gap:1rem;
}

/* Every timer unit */
.tu{
  display:flex;flex-direction:column;align-items:center;gap:.5rem;
  position:relative;
}

/* The digit box */
.td-wrap{
  position:relative;
  padding:.7rem 1rem .6rem;
  background:rgba(0,10,3,.85);
  border:1px solid rgba(0,255,65,.18);
  overflow:hidden;
  /* Corner brackets via box-shadow layers */
  box-shadow:
    inset 1px 1px 0 rgba(0,255,65,.35),
    inset -1px -1px 0 rgba(0,255,65,.35),
    0 0 20px rgba(0,255,65,.04);
}
/* top-left corner */
.td-wrap::before{
  content:'';position:absolute;
  top:-1px;left:-1px;
  width:10px;height:10px;
  border-top:1px solid var(--matrix);
  border-left:1px solid var(--matrix);
  pointer-events:none;
}
/* bottom-right corner */
.td-wrap::after{
  content:'';position:absolute;
  bottom:-1px;right:-1px;
  width:10px;height:10px;
  border-bottom:1px solid var(--matrix);
  border-right:1px solid var(--matrix);
  pointer-events:none;
}

/* Scanline inside every box */
.td-wrap .scanline{
  position:absolute;inset:0;pointer-events:none;z-index:2;
  background:repeating-linear-gradient(
    0deg,transparent,transparent 2px,
    rgba(0,255,65,.018) 2px,rgba(0,255,65,.018) 4px
  );
}

/* The digit itself */
.td{
  font-family:var(--font-mono);
  font-size:var(--timer-sz);
  font-weight:400;line-height:1;
  color:var(--matrix);
  letter-spacing:-.02em;
  display:block;min-width:2ch;text-align:center;
  position:relative;z-index:1;
  text-shadow:
    0 0 14px var(--matrix-glow),
    0 0 35px rgba(0,255,65,.18),
    0 0 70px rgba(0,255,65,.08);
  transition:color .7s,text-shadow .7s;
}

/* YEARS — primary, largest */
.tu--years .td-wrap{
  border-color:rgba(0,255,65,.45);
  background:rgba(0,16,6,.92);
  box-shadow:
    inset 1px 1px 0 rgba(0,255,65,.55),
    inset -1px -1px 0 rgba(0,255,65,.55),
    0 0 35px rgba(0,255,65,.10),
    0 0 60px rgba(0,255,65,.04);
  padding:.8rem 1.4rem .7rem;
}
.tu--years .td{
  font-size:calc(var(--timer-sz) * 1.45);
  text-shadow:
    0 0 20px var(--matrix-glow),
    0 0 55px rgba(0,255,65,.28),
    0 0 110px rgba(0,255,65,.12);
}
.tu--years .td-wrap::before,
.tu--years .td-wrap::after{
  width:14px;height:14px;
  border-width:2px;
  border-color:var(--matrix);
}

/* DAYS — secondary */
.tu--days .td{font-size:calc(var(--timer-sz) * 1.12)}
.tu--days .td-wrap{border-color:rgba(0,255,65,.28)}

/* Digit label */
.tl{
  font-family:var(--font-mono);font-size:.5rem;
  letter-spacing:.35em;color:var(--text-muted);
  text-transform:uppercase;
}

/* Separators */
.t-dot{
  font-family:var(--font-mono);
  font-size:calc(var(--timer-sz) * .55);
  color:var(--matrix-deep);
  line-height:1;
  padding-bottom:1.6rem;
  text-shadow:0 0 10px rgba(0,255,65,.25);
  opacity:.7;
}
.t-colon{
  font-family:var(--font-mono);
  font-size:var(--timer-sz);
  color:var(--matrix-deep);
  line-height:1;
  padding-bottom:1.6rem;
  animation:col-blink 1s step-end infinite;
  text-shadow:0 0 8px rgba(0,255,65,.2);
}
@keyframes col-blink{0%,100%{opacity:1}50%{opacity:.06}}

/* Tick animation */
.td.tick{animation:digit-tick .13s ease}
@keyframes digit-tick{
  0%{transform:translateY(-6px);opacity:.45}
  100%{transform:translateY(0);opacity:1}
}

/* Expired */
.td.expired{animation:timer-decay 2.8s ease forwards}
@keyframes timer-decay{
  0%{color:var(--matrix);text-shadow:0 0 20px var(--matrix-glow),0 0 50px rgba(0,255,65,.2)}
  30%{color:#00881e;text-shadow:0 0 10px rgba(0,150,30,.4)}
  70%{color:#003308;text-shadow:0 0 4px rgba(0,50,8,.2)}
  100%{color:#030803;text-shadow:none}
}

/* Phrase */
.release-phrase{
  font-family:var(--font-sans);
  font-size:clamp(.85rem,1.6vw,1rem);
  color:var(--text-secondary);
  max-width:460px;line-height:1.75;
  margin-bottom:2.5rem;
  font-style:italic;white-space:pre-line;
}

/* System messages */
#sys-messages{
  font-family:var(--font-mono);font-size:.6rem;
  letter-spacing:.22em;color:var(--matrix-deep);
  text-transform:uppercase;
  min-height:1.2em;
  transition:opacity .3s ease;
}

/* ================================================================
   TRANSITION OVERLAY
   ================================================================ */
#transition-overlay{
  position:fixed;inset:0;z-index:1100;
  background:var(--void);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:1.5rem;
  opacity:0;pointer-events:none;
  transition:opacity .6s ease;
}
#transition-overlay.active{opacity:1;pointer-events:auto}

.t-line{
  position:absolute;left:0;right:0;height:1px;
  background:var(--matrix);
  box-shadow:0 0 12px var(--matrix-glow);
  transform:scaleX(0);transform-origin:left;
  transition:transform 1.2s cubic-bezier(.16,1,.3,1);
}
.t-line:nth-child(1){top:0}
.t-line:nth-child(2){bottom:0;transform-origin:right}
#transition-overlay.active .t-line{transform:scaleX(1)}

.t-text{
  font-family:var(--font-mono);
  font-size:clamp(.75rem,1.5vw,.9rem);
  letter-spacing:.6em;color:var(--matrix);
  text-transform:uppercase;
  animation:t-blink .6s step-end infinite;
}
@keyframes t-blink{0%,100%{opacity:1}50%{opacity:0}}
.t-subtext{
  font-family:var(--font-mono);font-size:.6rem;
  letter-spacing:.3em;color:var(--text-muted);
  text-transform:uppercase;
}

/* ================================================================
   POST-RELEASE NAVIGATION
   ================================================================ */
#pr-nav{
  position:fixed;top:0;left:0;right:0;z-index:800;
  padding:.9rem 2rem;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(0,0,0,.82);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  transform:translateY(-100%);opacity:0;
  transition:transform .5s ease,opacity .5s ease;
}
#pr-nav.visible{transform:translateY(0);opacity:1}
.pr-nav-logo{
  font-family:var(--font-mono);font-size:.65rem;
  letter-spacing:.28em;color:var(--matrix-dim);text-transform:uppercase;
}
.pr-nav-links{
  display:flex;gap:1.5rem;list-style:none;
}
.pr-nav-links a{
  font-family:var(--font-mono);font-size:.6rem;
  letter-spacing:.18em;color:var(--text-muted);
  text-transform:uppercase;transition:color var(--t-fast);
}
.pr-nav-links a:hover{color:var(--matrix)}

/* ================================================================
   POST-RELEASE: GLOBAL
   ================================================================ */
#post-release{
  display:none;position:relative;z-index:10;
}
#post-release.visible{
  display:block;
  animation:pr-emerge var(--t-reveal) forwards;
}
@keyframes pr-emerge{
  from{opacity:0;transform:translateY(50px)}
  to{opacity:1;transform:translateY(0)}
}

/* Section wrapper */
.pr-section{
  padding:var(--section-py) clamp(1.5rem,5vw,3rem);
  max-width:var(--max-w);margin:0 auto;
  border-bottom:1px solid var(--border-line);
}
.pr-section--wide{
  max-width:100%;
  padding-left:clamp(1.5rem,6vw,5rem);
  padding-right:clamp(1.5rem,6vw,5rem);
}
.pr-section--center{text-align:center}

/* Section tag */
.s-tag{
  font-family:var(--font-mono);font-size:.58rem;
  letter-spacing:.42em;color:var(--matrix-dim);
  text-transform:uppercase;margin-bottom:1.2rem;
  display:flex;align-items:center;gap:.8rem;
}
.s-tag::before{
  content:'';display:block;
  width:28px;height:1px;background:var(--matrix-deep);
  flex-shrink:0;
}

/* Section title */
.s-title{
  font-family:var(--font-sans);
  font-size:clamp(2rem,5vw,3.6rem);
  font-weight:700;letter-spacing:-.025em;
  line-height:1.08;margin-bottom:1.6rem;
  color:var(--text-primary);
}
.s-title--xl{
  font-size:clamp(2.5rem,7vw,5rem);
  letter-spacing:-.035em;
}
.s-title--accent{
  background:linear-gradient(135deg,#c8e6c8,var(--matrix-dim));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}

/* Body text */
.s-body{
  font-size:clamp(.92rem,1.5vw,1.05rem);
  color:var(--text-secondary);line-height:1.85;
  max-width:700px;
}
.s-body strong{color:var(--matrix-dim);font-weight:500}
.s-body p+p{margin-top:1.2em}

/* ================================================================
   HERO (post-release)
   ================================================================ */
.pr-hero{
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;
  padding:6rem 2rem 4rem;
  position:relative;
  overflow:hidden;
  border-bottom:1px solid var(--border-line);
}

.pr-hero::before{
  content:'';position:absolute;
  bottom:0;left:50%;transform:translateX(-50%);
  width:1px;height:80px;
  background:linear-gradient(to bottom,transparent,var(--border-bright));
}

.hero-tag{
  font-family:var(--font-mono);font-size:.62rem;
  letter-spacing:.45em;color:var(--matrix);
  text-transform:uppercase;margin-bottom:2rem;
  opacity:0;animation:fade-up .8s .5s ease forwards;
}
.hero-main-title{
  font-family:var(--font-sans);
  font-size:clamp(3rem,10vw,7.5rem);
  font-weight:700;letter-spacing:-.04em;
  line-height:.92;margin-bottom:1rem;
  background:linear-gradient(165deg,#ffffff 20%,#8aaa8a 70%,#2a5a2a);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  opacity:0;animation:fade-up .9s .7s ease forwards;
}
.hero-school{
  font-family:var(--font-mono);
  font-size:clamp(.75rem,1.8vw,1rem);
  letter-spacing:.35em;color:var(--text-secondary);
  text-transform:uppercase;margin-bottom:2rem;
  opacity:0;animation:fade-up .8s .9s ease forwards;
}
.hero-subtitle{
  font-size:clamp(1rem,2.5vw,1.35rem);
  font-weight:300;color:var(--text-secondary);
  max-width:520px;line-height:1.55;
  margin-bottom:3rem;
  opacity:0;animation:fade-up .8s 1.1s ease forwards;
}
.hero-years{
  font-family:var(--font-mono);
  font-size:clamp(3rem,8vw,5.5rem);
  color:var(--matrix-deep);letter-spacing:.15em;
  line-height:1;opacity:.4;
  opacity:0;animation:fade-up .8s 1.3s ease forwards;
}

@keyframes fade-up{
  from{opacity:0;transform:translateY(22px)}
  to{opacity:1;transform:translateY(0)}
}

/* ================================================================
   MANIFESTO
   ================================================================ */
.manifesto-body{
  font-family:var(--font-sans);
  font-size:clamp(1.15rem,2.8vw,1.7rem);
  font-weight:300;line-height:1.65;
  color:var(--text-primary);
  max-width:820px;
}
.manifesto-body strong{
  color:var(--matrix-dim);font-weight:600;
}

/* ================================================================
   TIMELINE
   ================================================================ */
.timeline{
  position:relative;margin-top:3.5rem;
}
.timeline::before{
  content:'';position:absolute;
  left:50%;top:0;bottom:0;width:1px;
  background:linear-gradient(
    to bottom,
    transparent 0%,
    var(--border-bright) 15%,
    var(--border-bright) 85%,
    transparent 100%
  );
  transform:translateX(-50%);
}
@media(max-width:700px){.timeline::before{left:22px}}

.tl-entry{
  display:grid;
  grid-template-columns:1fr 40px 1fr;
  gap:0 1.5rem;
  margin-bottom:3.5rem;
  align-items:start;
}
.tl-entry:nth-child(odd) .tl-year{text-align:right}
.tl-entry:nth-child(odd) .tl-content{text-align:left}
.tl-entry:nth-child(even) .tl-year{
  grid-column:3;grid-row:1;
  text-align:left;
}
.tl-entry:nth-child(even) .tl-dot{grid-column:2;grid-row:1}
.tl-entry:nth-child(even) .tl-content{
  grid-column:1;grid-row:1;
  text-align:right;
}

@media(max-width:700px){
  .tl-entry{
    grid-template-columns:44px 1fr;
    grid-template-rows:auto auto;
  }
  .tl-entry:nth-child(odd) .tl-year,
  .tl-entry:nth-child(even) .tl-year{
    grid-column:2;grid-row:1;
    text-align:left;font-size:1.4rem;
  }
  .tl-entry:nth-child(odd) .tl-dot,
  .tl-entry:nth-child(even) .tl-dot{
    grid-column:1;grid-row:1 / 3;
    align-self:start;margin-top:4px;
  }
  .tl-entry:nth-child(odd) .tl-content,
  .tl-entry:nth-child(even) .tl-content{
    grid-column:2;grid-row:2;
    text-align:left;
  }
}

.tl-year{
  font-family:var(--font-mono);
  font-size:clamp(2rem,4vw,3rem);
  color:var(--matrix-deep);line-height:1;
  font-weight:400;
  transition:color var(--t-mid);
}
.tl-entry:hover .tl-year{color:var(--matrix-dim)}

.tl-dot{
  display:flex;align-items:flex-start;justify-content:center;
  padding-top:8px;
}
.tl-dot-inner{
  width:11px;height:11px;border-radius:50%;
  border:1px solid var(--matrix-deep);
  background:var(--void);
  position:relative;transition:border-color var(--t-fast);
}
.tl-dot-inner::after{
  content:'';position:absolute;inset:3px;
  border-radius:50%;background:var(--matrix-deep);
  transition:background var(--t-fast);
}
.tl-entry:hover .tl-dot-inner{border-color:var(--matrix-dim)}
.tl-entry:hover .tl-dot-inner::after{background:var(--matrix-dim)}

.tl-content-title{
  font-family:var(--font-sans);
  font-size:clamp(.95rem,1.8vw,1.1rem);
  font-weight:600;color:var(--text-primary);
  margin-bottom:.45rem;line-height:1.3;
}
.tl-content-body{
  font-size:.88rem;color:var(--text-secondary);
  line-height:1.7;
}

/* Timeline scroll reveal */
.tl-entry{
  opacity:0;transform:translateY(24px);
  transition:opacity .7s ease,transform .7s ease;
}
.tl-entry.visible{opacity:1;transform:none}

/* ================================================================
   STATS GRID
   ================================================================ */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:1px;margin-top:3rem;
  border:1px solid var(--border);
}
.stat-card{
  padding:1.8rem 1.5rem;
  background:var(--surface);
  position:relative;overflow:hidden;
  transition:background var(--t-fast);
}
.stat-card::before{
  content:'';position:absolute;top:0;left:0;right:0;
  height:2px;background:var(--matrix-deep);
  transition:background var(--t-fast);
}
.stat-card:hover{background:var(--surface-2)}
.stat-card:hover::before{background:var(--matrix)}

.stat-value{
  font-family:var(--font-mono);
  font-size:clamp(1.4rem,3vw,2rem);
  color:var(--matrix);line-height:1;
  margin-bottom:.5rem;
  text-shadow:0 0 12px var(--matrix-glow-sm);
}
.stat-label{
  font-size:.82rem;color:var(--text-secondary);
  line-height:1.4;
}
.stat-source{
  font-family:var(--font-mono);font-size:.52rem;
  color:var(--text-muted);letter-spacing:.1em;
  margin-top:1.2rem;text-transform:uppercase;
}

/* ================================================================
   QUOTE BLOCK
   ================================================================ */
.quote-block{
  border-left:2px solid var(--matrix);
  padding:1.5rem 2rem;margin:3.5rem 0;
  position:relative;background:var(--matrix-ghost);
}
.quote-text{
  font-size:clamp(1.05rem,2.2vw,1.3rem);
  font-weight:300;color:var(--text-primary);
  line-height:1.65;font-style:italic;
}
.quote-author{
  font-family:var(--font-mono);font-size:.65rem;
  letter-spacing:.22em;color:var(--matrix-dim);
  margin-top:1rem;text-transform:uppercase;
}

/* ================================================================
   KEYWORD CLOUD
   ================================================================ */
.keyword-cloud{
  display:flex;flex-wrap:wrap;gap:.45rem;margin-top:2.5rem;
}
.kw-tag{
  font-family:var(--font-mono);font-size:.65rem;
  letter-spacing:.08em;color:var(--text-muted);
  border:1px solid var(--border);
  padding:.28rem .58rem;text-transform:lowercase;
  transition:all var(--t-fast);cursor:default;
  border-radius:1px;
}
.kw-tag:hover{
  color:var(--matrix);
  border-color:var(--matrix-deep);
  background:var(--matrix-ghost);
}

/* ================================================================
   MESSAGE TO FUTURE
   ================================================================ */
.future-section{
  padding:var(--section-py) clamp(1.5rem,5vw,3rem);
  max-width:860px;margin:0 auto;
  border-bottom:1px solid var(--border-line);
}
.future-body{
  font-size:clamp(1.1rem,2.5vw,1.45rem);
  font-weight:300;color:var(--text-primary);
  line-height:1.8;white-space:pre-line;
  margin-bottom:1.5rem;
}
.future-body-2{
  font-size:clamp(.95rem,1.8vw,1.1rem);
  color:var(--text-secondary);
  line-height:1.8;white-space:pre-line;
}
.future-sig{
  font-family:var(--font-mono);font-size:.72rem;
  letter-spacing:.3em;color:var(--matrix);
  text-transform:uppercase;margin-top:3rem;
  display:flex;align-items:center;gap:.8rem;
}
.future-sig::before{
  content:'';display:block;
  width:24px;height:1px;background:var(--matrix);
}

/* ================================================================
   CREDITS
   ================================================================ */
.credits-section{
  padding:var(--section-py) 2rem 6rem;
  text-align:center;position:relative;
  border-bottom:none;
}
.credits-label{
  font-family:var(--font-mono);font-size:.6rem;
  letter-spacing:.45em;color:var(--text-muted);
  text-transform:uppercase;margin-bottom:3rem;
}
.credits-class{
  font-family:var(--font-sans);
  font-size:clamp(3.5rem,10vw,7rem);
  font-weight:700;letter-spacing:-.04em;
  color:var(--text-primary);line-height:1;
  margin-bottom:.4rem;
}
.credits-school{
  font-family:var(--font-mono);font-size:.85rem;
  letter-spacing:.3em;color:var(--text-secondary);
  text-transform:uppercase;margin-bottom:3.5rem;
}
.credits-year{
  font-family:var(--font-mono);
  font-size:clamp(4rem,14vw,10rem);
  color:var(--matrix-deep);font-weight:400;
  line-height:1;opacity:.3;
  letter-spacing:.08em;
}
.credits-micro{
  font-family:var(--font-mono);font-size:.55rem;
  letter-spacing:.25em;color:var(--text-muted);
  text-transform:uppercase;margin-top:4rem;
  opacity:.5;
}

/* ================================================================
   SCROLL REVEAL
   ================================================================ */
.reveal{
  opacity:0;transform:translateY(36px);
  transition:opacity .9s cubic-bezier(.4,0,.2,1),
             transform .9s cubic-bezier(.4,0,.2,1);
}
.reveal.visible{opacity:1;transform:none}
.reveal-delay-1{transition-delay:.1s}
.reveal-delay-2{transition-delay:.2s}
.reveal-delay-3{transition-delay:.3s}
.reveal-delay-4{transition-delay:.4s}

   HORIZONTAL RULE / DIVIDER

.section-hr{
  width:100%;height:1px;
  background:linear-gradient(
    to right,transparent,var(--border-bright) 30%,

<!-- ═══════════════════════════════════════════
     APPLICATION SCRIPT
     ═══════════════════════════════════════════ -->
<script>
/* ================================================================
   TIME CAPSULE 5B INF — Main Application
   ================================================================ */
(function() {
'use strict';

/* ── CONFIG ── */
const rawConfig = JSON.parse(
  document.getElementById('capsule-config').textContent
);
const CONFIG = {
  workerUrl: rawConfig.workerUrl !== 'WORKER_URL_PLACEHOLDER'
    ? rawConfig.workerUrl : null,
  releaseDate: new Date(rawConfig.releaseDate),
  previewParam: rawConfig.previewParam,
};

/* ── STATE ── */
let currentLang = localStorage.getItem('tc-lang') || 'it';
let releaseTs = CONFIG.releaseDate.getTime();
let serverTimeOffset = 0;
let released = false;
let timerInterval = null;

/* ════════════════════════════════════════
   I18N
   ════════════════════════════════════════ */
const T = {
  it: {
    'pre.label': 'TIME CAPSULE',
    'pre.phrase': 'Il futuro si conserva nel codice.\nIl passato si rivela al momento giusto.',
    'timer.years': 'ANNI',
    'timer.days': 'GIORNI',
    'timer.hours': 'ORE',
    'timer.minutes': 'MINUTI',
    'timer.seconds': 'SECONDI',
    'status.sealed': '⬡  CAPSULA SIGILLATA',
    'status.locked': '⬡  ARCHIVIO BLOCCATO',
    'status.pending': '⬡  RILASCIO IN ATTESA',
    'status.synced': '⬡  MEMORIA SINCRONIZZATA',
    'status.scheduled': '⬡  ACCESSO PROGRAMMATO',
    'transition.text': 'ARCHIVIO IN APERTURA',
    'transition.sub': 'DECIFRAZIONE — RILASCIO AUTORIZZATO',
  },
  en: {
    'pre.label': 'TIME CAPSULE',
    'pre.phrase': 'The future is preserved in code.\nThe past reveals itself at the right moment.',
    'timer.years': 'YEARS',
    'timer.days': 'DAYS',
    'timer.hours': 'HOURS',
    'timer.minutes': 'MINUTES',
    'timer.seconds': 'SECONDS',
    'status.sealed': '⬡  CAPSULE SEALED',
    'status.locked': '⬡  ARCHIVE LOCKED',
    'status.pending': '⬡  RELEASE PENDING',
    'status.synced': '⬡  MEMORY SYNCHRONIZED',
    'status.scheduled': '⬡  ACCESS SCHEDULED',
    'transition.text': 'ARCHIVE UNLOCKING',
    'transition.sub': 'DECRYPTING — RELEASE AUTHORIZED',
  }
};

function t(key) {
  return (T[currentLang] && T[currentLang][key]) ||
         (T['it'] && T['it'][key]) || key;
}

function setLang(lang) {
  if (!T[lang]) return;
  currentLang = lang;
  localStorage.setItem('tc-lang', lang);
  document.documentElement.lang = lang;
  applyTranslations();
  updateLangButtons();
}

function applyTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    el.textContent = t(k);
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    el.innerHTML = t(el.dataset.i18nHtml);
  });
}

function updateLangButtons() {
  document.querySelectorAll('.lang-btn').forEach(btn => {
    const active = btn.dataset.lang === currentLang;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-pressed', String(active));
  });
}

/* ════════════════════════════════════════
   MATRIX RAIN
   ════════════════════════════════════════ */
function initMatrix() {
  const canvas = document.getElementById('matrix-canvas');
  if (!canvas) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    canvas.style.display = 'none'; return;
  }

  const ctx = canvas.getContext('2d');

  /* ── Exact Matrix film charset: half-width katakana + numerals ── */
  const KATAKANA = 'ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ';
  const NUMS     = '0123456789';
  const LATIN    = 'ABCDEFZ';
  const PUNCT    = ':."=*+-<>';
  const CA       = (KATAKANA + NUMS + LATIN + PUNCT).split('');
  const FS       = 16;

  let W, H, cols;
  let streams = [];

  /* Each column can hold multiple independent streams */
  function mkStream(col, startY) {
    return {
      col,
      y:      startY !== undefined ? startY : -(4 + Math.random() * 60),
      speed:  0.7 + Math.random() * 1.1,          // chars/frame at ~10fps
      len:    14 + Math.floor(Math.random() * 26), // trail length
      chars:  Array.from({length: 50}, () => CA[Math.floor(Math.random() * CA.length)]),
      active: true,
    };
  }

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cols    = Math.floor(W / FS);

    /* Seed: one stream per column, staggered vertically */
    streams = [];
    for (let c = 0; c < cols; c++) {
      /* Random initial Y spread across full height */
      streams.push(mkStream(c, -(Math.random() * (H / FS + 20))));
    }
  }

  resize();
  let rsT;
  window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(resize, 200); });

  /* Shimmer: a tiny set of bright-flash positions updated every draw */
  const shimmer = new Set();

  function rndCh() { return CA[Math.floor(Math.random() * CA.length)]; }

  /* ── Color palette: exact film gradient ─────────────────────── */
  //  j=0 → head (white blink), j=1…n → trail fading to black
  const TRAIL_COLORS = [
    null,            // 0 = head (handled separately)
    '#ccffcc',       // 1: very close to head
    '#88ee88',       // 2
    '#00ff41',       // 3-4: classic Matrix green
    '#00ff41',
    '#00dd38',       // 5-6
    '#00bb30',
    '#009928',       // 7-9: medium green
    '#008020',
    '#006818',
    '#004d12',       // 10-13: dark
    '#003308',
    '#002206',
    '#001504',
    '#000e02',       // 14+: near-black
  ];
  function trailColor(j, len) {
    const idx = Math.min(Math.round((j / len) * (TRAIL_COLORS.length - 1)), TRAIL_COLORS.length - 1);
    return TRAIL_COLORS[idx] || '#000e02';
  }

  let frame     = 0;
  let blinkOn   = true;
  let lastBlink = 0;
  const BLINK_MS = 85; // ~12 Hz — snappy terminal blink

  function draw(ts) {
    requestAnimationFrame(draw);
    frame++;

    /* Render at ~10 fps: skip every 6th animation frame */
    if (frame % 6 !== 0) return;

    /* Blink toggle */
    if (ts - lastBlink > BLINK_MS) { blinkOn = !blinkOn; lastBlink = ts; }

    /* Background fade — lower = longer trail */
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.fillRect(0, 0, W, H);

    ctx.font = `${FS}px 'Share Tech Mono',monospace`;

    /* Regenerate shimmer set (~0.5% of cells flash white this frame) */
    shimmer.clear();
    const shimCount = Math.floor(cols * 0.004);
    for (let s = 0; s < shimCount; s++) {
      shimmer.add(Math.floor(Math.random() * cols) * 1000 + Math.floor(Math.random() * 30));
    }

    for (let si = 0; si < streams.length; si++) {
      const st = streams[si];
      const x  = st.col * FS;
      const hRow = Math.floor(st.y);

      /* ── Draw trail (from tail → just-behind-head) ─────────── */
      for (let j = st.len; j >= 1; j--) {
        const row = hRow - j;
        const py  = row * FS + FS; // +FS so row=0 is on screen
        if (py < 0 || py > H + FS) continue;

        /* Randomly mutate character (~5% chance per frame) */
        if (Math.random() < 0.05) st.chars[j] = rndCh();

        /* Shimmer flash: occasional bright white flicker */
        const shimKey = st.col * 1000 + j;
        if (shimmer.has(shimKey)) {
          ctx.shadowColor = '#00ff41';
          ctx.shadowBlur  = 8;
          ctx.fillStyle   = '#ccffcc';
        } else {
          ctx.shadowBlur  = 0;
          ctx.fillStyle   = trailColor(j, st.len);
        }
        ctx.fillText(st.chars[j], x, py);
      }

      /* ── Head character: white + shell-cursor blink ─────────── */
      const hy = hRow * FS + FS;
      if (hy >= 0 && hy <= H + FS) {
        /* Head always gets a fresh random char */
        st.chars[0] = rndCh();

        if (blinkOn) {
          ctx.shadowColor = '#ffffff';
          ctx.shadowBlur  = 18;
          ctx.fillStyle   = '#ffffff';
        } else {
          ctx.shadowColor = '#00ff41';
          ctx.shadowBlur  = 10;
          ctx.fillStyle   = '#aaffaa';
        }
        ctx.fillText(st.chars[0], x, hy);
        ctx.shadowBlur = 0;
      }

      /* ── Advance stream ─────────────────────────────────────── */
      st.y += st.speed;

      /* Reset when entire trail is off-screen */
      if ((hRow - st.len) * FS > H) {
        /* Occasionally spawn a second simultaneous stream on same col */
        if (Math.random() < 0.08) {
          streams.push(mkStream(st.col, -(2 + Math.random() * 20)));
        }
        Object.assign(st, mkStream(st.col));
      }
    }

    /* Prune extra streams: never more than cols * 1.5 */
    if (streams.length > cols * 1.5) {
      streams = streams.filter((s, i) => i < cols || s.y > 0);
    }

    ctx.shadowBlur = 0;
  }

  requestAnimationFrame(draw);
}

/* ════════════════════════════════════════
   TIMER
   ════════════════════════════════════════ */
function getNow() { return Date.now() + serverTimeOffset; }

function pad(n) { return String(Math.max(0, n)).padStart(2, '0'); }

function renderTimer(ms) {
  if (ms < 0) ms = 0;

  // Calculate years properly (accounting for leap years)
  const nowDate     = new Date(getNow());
  const releaseDate = new Date(releaseTs);

  let years = releaseDate.getFullYear() - nowDate.getFullYear();
  // Walk back if we haven't reached the anniversary month/day yet
  const afterYears = new Date(nowDate);
  afterYears.setFullYear(afterYears.getFullYear() + years);
  if (afterYears > releaseDate) years = Math.max(0, years - 1);

  const baseDate = new Date(nowDate);
  baseDate.setFullYear(baseDate.getFullYear() + years);
  const remainMs   = Math.max(0, releaseDate - baseDate);
  const totalSecs  = Math.floor(remainMs / 1000);
  const days       = Math.floor(totalSecs / 86400);
  const hours      = Math.floor((totalSecs % 86400) / 3600);
  const minutes    = Math.floor((totalSecs % 3600) / 60);
  const seconds    = totalSecs % 60;

  setDigit('timer-years',   String(Math.max(0, years)).padStart(2, '0'));
  setDigit('timer-days',    String(days).padStart(3, '0'));
  setDigit('timer-hours',   pad(hours));
  setDigit('timer-minutes', pad(minutes));
  setDigit('timer-seconds', pad(seconds));
}

function setDigit(id, val) {
  const el = document.getElementById(id);
  if (!el || el.textContent === val) return;
  el.textContent = val;
  el.dataset.value = val;
  el.classList.remove('tick');
  void el.offsetWidth; // reflow
  el.classList.add('tick');
}

function startTimer() {
  function tick() {
    const rem = releaseTs - getNow();
    if (rem <= 0) {
      clearInterval(timerInterval);
      renderTimer(0);
      if (!released) triggerRelease();
      return;
    }
    renderTimer(rem);
  }
  tick();
  timerInterval = setInterval(tick, 1000);
}

/* ════════════════════════════════════════
   WORKER API
   ════════════════════════════════════════ */
async function checkWorker() {
  if (!CONFIG.workerUrl) {
    // No worker: use local time vs config release date
    releaseTs = CONFIG.releaseDate.getTime();
    return { isReleased: Date.now() >= releaseTs, key: null };
  }
  try {
    const t0 = Date.now();
    const res = await fetch(`${CONFIG.workerUrl}/api/status`, {
      cache: 'no-store', signal: AbortSignal.timeout(5000)
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    // Calibrate clock with server
    serverTimeOffset = data.serverTime - Date.now();
    releaseTs = data.releaseTimestamp;

    if (!data.isReleased) return { isReleased: false, key: null };

    // Fetch decryption key
    const kr = await fetch(`${CONFIG.workerUrl}/api/content`, {
      cache: 'no-store', signal: AbortSignal.timeout(5000)
    });
    if (!kr.ok) return { isReleased: true, key: null };
    const kd = await kr.json();
    return { isReleased: true, key: kd.key || null };
  } catch (e) {
    console.warn('[TC] Worker unavailable, falling back to local time:', e.message);
    releaseTs = CONFIG.releaseDate.getTime();
    return { isReleased: Date.now() >= releaseTs, key: null };
  }
}

/* ════════════════════════════════════════
   DECRYPTION
   ════════════════════════════════════════ */
async function decryptPayload(b64, keyHex) {
  try {
    const keyBytes = new Uint8Array(keyHex.match(/../g).map(h => parseInt(h, 16)));
    const raw = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const iv = raw.slice(0, 12);
    const ct = raw.slice(12);
    const k = await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-GCM' }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, k, ct);
    return JSON.parse(new TextDecoder().decode(pt));
  } catch (e) {
    console.error('[TC] Decryption failed:', e);
    return null;
  }
}

/* ════════════════════════════════════════
   RELEASE SEQUENCE
   ════════════════════════════════════════ */
async function triggerRelease(decryptedContent) {
  released = true;

  // Step 1: expire timer digits
  document.querySelectorAll('.timer-digits').forEach(el => el.classList.add('expired'));

  await sleep(1800);

  // Step 2: show transition overlay
  const overlay = document.getElementById('transition-overlay');
  applyTranslations(); // ensure transition text is correct lang
  overlay.classList.add('active');

  await sleep(900);

  // Step 3: fade out pre-release
  const pre = document.getElementById('pre-release');
  pre.style.transition = 'opacity .9s ease, transform .7s ease';
  pre.style.opacity = '0';
  pre.style.transform = 'translateY(-28px)';

  // Dim matrix
  const canvas = document.getElementById('matrix-canvas');
  if (canvas) { canvas.style.opacity = '0.12'; }

  await sleep(900);
  pre.style.display = 'none';

  // Step 4: inject decrypted HTML then show post-release
  if (decryptedContent && decryptedContent.html) {
    document.getElementById('post-release').innerHTML = decryptedContent.html;
  }
  const post = document.getElementById('post-release');
  post.hidden = false;
  post.classList.add('visible');
  html('post-release').dataset.state = 'released';
  document.documentElement.dataset.state = 'released';

  // Step 5: fade out overlay
  overlay.style.transition = 'opacity .8s ease';
  overlay.style.opacity = '0';
  setTimeout(() => { overlay.classList.remove('active'); overlay.style.opacity = ''; }, 850);

  // Step 6: show nav
  setTimeout(() => {
    const nav = document.getElementById('pr-nav');
    if (nav) nav.classList.add('visible');
  }, 1200);

  // Step 7: scroll animations
  initScrollReveal();

  // Step 8: if decrypted content, overlay it
  if (decryptedContent) applyDecryptedContent(decryptedContent);
}

function applyDecryptedContent(content) {
  // Merge decrypted i18n strings into T and re-apply translations.
  // HTML injection is done in triggerRelease before this is called.
  if (content['it']) Object.entries(content['it']).forEach(([k, v]) => { if (k !== 'html') T['it'][k] = v; });
  if (content['en']) Object.entries(content['en']).forEach(([k, v]) => { if (k !== 'html') T['en'][k] = v; });
  applyTranslations();
}

/* ════════════════════════════════════════
   SYSTEM MESSAGES
   ════════════════════════════════════════ */
function initSysMessages() {
  const el = document.getElementById('sys-messages');
  if (!el) return;
  const keys = ['status.sealed','status.locked','status.pending','status.synced','status.scheduled'];
  let i = 0;
  function show() {
    el.style.opacity = '0';
    setTimeout(() => {
      el.textContent = t(keys[i++ % keys.length]);
      el.style.opacity = '1';
    }, 320);
  }
  el.style.transition = 'opacity .32s ease';
  show();
  setInterval(show, 3800);
}

/* ════════════════════════════════════════
   SCROLL REVEAL
   ════════════════════════════════════════ */
function initScrollReveal() {
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        obs.unobserve(e.target);
      }
    });
  }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

  document.querySelectorAll('.reveal, .tl-entry').forEach(el => obs.observe(el));
}

/* ════════════════════════════════════════
   HELPERS
   ════════════════════════════════════════ */
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function html(id) { return document.getElementById(id) || document.documentElement; }

/* ════════════════════════════════════════
   INIT
   ════════════════════════════════════════ */
async function init() {
  // Dev preview override: ?tc_preview_5b=1
  const urlParams = new URLSearchParams(window.location.search);
  const isPreview = urlParams.get(CONFIG.previewParam) === '1';

  // Language
  document.documentElement.lang = currentLang;
  applyTranslations();
  updateLangButtons();

  // Lang buttons
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => setLang(btn.dataset.lang));
  });

  // Matrix
  initMatrix();

  // System messages
  initSysMessages();

  // Check release
  const { isReleased, key } = isPreview
    ? { isReleased: true, key: null }
    : await checkWorker();

  if (isReleased) {
    let decrypted = null;
    if (key) {
      const payload = JSON.parse(document.getElementById('capsule-payload').textContent);
      if (payload.data && payload.data !== 'ENCRYPTED_BLOB_PLACEHOLDER') {
        decrypted = await decryptPayload(payload.data, key);
      }
    }
    await sleep(isPreview ? 500 : 2000);
    await triggerRelease(decrypted);
  } else {
    startTimer();
    // Re-check every 30s
    setInterval(async () => {
      const { isReleased: nr, key: nk } = await checkWorker();
      if (nr && !released) {
        let dec = null;
        if (nk) {
          const payload = JSON.parse(document.getElementById('capsule-payload').textContent);
          if (payload.data && payload.data !== 'ENCRYPTED_BLOB_PLACEHOLDER') {
            dec = await decryptPayload(payload.data, nk);
          }
        }
        await triggerRelease(dec);
      }
    }, 30000);
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
