<!DOCTYPE html>

<head>

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><circle cx='16' cy='16' r='10' fill='none' stroke='%2300ff41' stroke-width='1.5'/><line x1='16' y1='6' x2='16' y2='16' stroke='%2300ff41' stroke-width='1.5'/><line x1='16' y1='16' x2='22' y2='19' stroke='%2300ff41' stroke-width='1.5'/></svg>">

  <style>
/* ── LOCKED VERSION: intentionally no post-release content ── */

:root {
  --void:       #000000;
  --matrix:     #00ff41;
  --matrix-dim: #00cc35;
  --matrix-deep:#004d18;
  --matrix-glow:rgba(0,255,65,.32);
  --text-pri:   #e4eae4;
  --text-sec:   #7a9080;
  --text-mut:   #2a3830;
  --border-br:  rgba(0,255,65,.26);
  --font-mono:  'Share Tech Mono','Courier New',monospace;
  --font-sans:  'Space Grotesk',-apple-system,sans-serif;
  --timer-sz:   clamp(3.2rem,9.5vw,7rem);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{
  background:var(--void);color:var(--text-pri);
  font-family:var(--font-sans);min-height:100vh;
  overflow-x:hidden;
}

/* Scanlines */
body::after{
  content:'';position:fixed;inset:0;z-index:999;pointer-events:none;
  background:repeating-linear-gradient(
    0deg,transparent,transparent 2px,
    rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px
  );
}

/* Matrix canvas */
#canvas{
  position:fixed;top:0;left:0;width:100%;height:100%;
  z-index:0;pointer-events:none;opacity:.38;
}

/* Lang switch */
.lang-sw{
  position:fixed;top:1.25rem;right:1.5rem;z-index:900;
  display:flex;border:1px solid var(--border-br);border-radius:2px;overflow:hidden;
}
.lang-btn{
  background:transparent;border:none;
  color:var(--text-sec);font-family:var(--font-mono);
  font-size:.68rem;letter-spacing:.12em;padding:.4rem .75rem;cursor:pointer;
  transition:all .18s ease;
}
.lang-btn.active{background:var(--matrix);color:var(--void);font-weight:bold}
.lang-btn:hover:not(.active){background:rgba(0,255,65,.06);color:var(--matrix)}

/* Main */
main{
  position:relative;z-index:10;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2rem 1.5rem 5rem;text-align:center;
}

/* Logo */
.logo{width:clamp(50px,8vw,72px);height:auto;margin-bottom:2.5rem;opacity:.85}

.label{
  font-family:var(--font-mono);font-size:clamp(.58rem,1.1vw,.7rem);
  letter-spacing:.38em;color:var(--text-mut);
  text-transform:uppercase;margin-bottom:.6rem;
}

.title{
  font-family:var(--font-sans);
  font-size:clamp(1.9rem,5.5vw,4rem);
  font-weight:700;letter-spacing:-.025em;
  line-height:1.05;margin-bottom:.55rem;
}
.title span{
  display:block;font-size:clamp(.95rem,2.3vw,1.7rem);
  font-weight:300;color:var(--text-sec);letter-spacing:.08em;
}

/* Status */
.status{
  display:flex;align-items:center;gap:.6rem;
  font-family:var(--font-mono);font-size:.62rem;
  letter-spacing:.22em;color:var(--matrix-dim);
  margin:1.8rem 0 2.5rem;
}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--matrix);
  box-shadow:0 0 8px var(--matrix),0 0 16px rgba(0,255,65,.18);
  flex-shrink:0;animation:dp 2.2s ease-in-out infinite;
}
@keyframes dp{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.35}}

/* Ultra Timer */
.timer-wrap{margin-bottom:2.5rem;animation:tbreathe 5s ease-in-out infinite}
@keyframes tbreathe{0%,100%{filter:brightness(1)}50%{filter:brightness(1.07) drop-shadow(0 0 22px rgba(0,255,65,.1))}}
.timer-disp{display:flex;align-items:center;justify-content:center;gap:.35rem;flex-wrap:wrap;row-gap:.9rem}
.tu{display:flex;flex-direction:column;align-items:center;gap:.5rem}
.td-wrap{position:relative;padding:.65rem .9rem .55rem;background:rgba(0,10,3,.85);border:1px solid rgba(0,255,65,.18);overflow:hidden;
  box-shadow:inset 1px 1px 0 rgba(0,255,65,.3),inset -1px -1px 0 rgba(0,255,65,.3)}
.td-wrap::before{content:'';position:absolute;top:-1px;left:-1px;width:9px;height:9px;border-top:1px solid var(--matrix);border-left:1px solid var(--matrix);pointer-events:none}
.td-wrap::after{content:'';position:absolute;bottom:-1px;right:-1px;width:9px;height:9px;border-bottom:1px solid var(--matrix);border-right:1px solid var(--matrix);pointer-events:none}
.scanline{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,65,.016) 2px,rgba(0,255,65,.016) 4px)}
.td{font-family:var(--font-mono);font-size:var(--timer-sz);font-weight:400;line-height:1;color:var(--matrix);letter-spacing:-.02em;display:block;min-width:2ch;text-align:center;position:relative;z-index:1;
  text-shadow:0 0 14px var(--matrix-glow),0 0 35px rgba(0,255,65,.18),0 0 70px rgba(0,255,65,.08);transition:color .7s,text-shadow .7s}
.tu-y .td-wrap{border-color:rgba(0,255,65,.42);background:rgba(0,16,6,.92);padding:.75rem 1.3rem .65rem;
  box-shadow:inset 1px 1px 0 rgba(0,255,65,.52),inset -1px -1px 0 rgba(0,255,65,.52),0 0 32px rgba(0,255,65,.08)}
.tu-y .td{font-size:calc(var(--timer-sz) * 1.45);text-shadow:0 0 22px var(--matrix-glow),0 0 55px rgba(0,255,65,.25),0 0 110px rgba(0,255,65,.1)}
.tu-d .td{font-size:calc(var(--timer-sz) * 1.1)}
.tu-d .td-wrap{border-color:rgba(0,255,65,.26)}
.tl{font-family:var(--font-mono);font-size:.5rem;letter-spacing:.35em;color:var(--text-mut);text-transform:uppercase}
.t-dot{font-family:var(--font-mono);font-size:calc(var(--timer-sz)*.55);color:var(--matrix-deep);line-height:1;padding-bottom:1.6rem;opacity:.7;text-shadow:0 0 10px rgba(0,255,65,.22)}
.t-col{font-family:var(--font-mono);font-size:var(--timer-sz);color:var(--matrix-deep);line-height:1;padding-bottom:1.6rem;animation:sb 1s step-end infinite;text-shadow:0 0 8px rgba(0,255,65,.18)}
@keyframes sb{0%,100%{opacity:1}50%{opacity:.06}}
.td.tick{animation:dtick .13s ease}
@keyframes dtick{0%{transform:translateY(-6px);opacity:.4}100%{transform:translateY(0);opacity:1}}

.phrase{
  font-family:var(--font-sans);
  font-size:clamp(.83rem,1.5vw,.98rem);
  color:var(--text-sec);max-width:440px;
  line-height:1.75;font-style:italic;white-space:pre-line;
  margin-bottom:2.5rem;
}

#sys{
  font-family:var(--font-mono);font-size:.6rem;
  letter-spacing:.22em;color:var(--matrix-deep);
  text-transform:uppercase;min-height:1.2em;
  transition:opacity .3s ease;
}

/* When released: show a redirect notice, never show content */
.released-notice{
  display:none;
  font-family:var(--font-mono);font-size:.75rem;
  letter-spacing:.18em;color:var(--matrix-dim);
  margin-top:2.5rem;text-transform:uppercase;
  border:1px solid var(--border-br);padding:1rem 1.5rem;
}
body.released .released-notice{display:block}

@media(max-width:480px){.ts{font-size:clamp(2.5rem,8vw,5rem)}}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  #canvas{display:none}
}
  </style>
</head>
<body>

<canvas id="canvas" aria-hidden="true"></canvas>

<div class="lang-sw">
  <button class="lang-btn active" data-lang="it">IT</button>
  <button class="lang-btn" data-lang="en">EN</button>
</div>

<main>
  <svg class="logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="44" stroke="#00cc35" stroke-width="1.2" opacity=".4"/>
    <circle cx="50" cy="50" r="36" stroke="#00cc35" stroke-width=".8" opacity=".2"/>
    <line x1="50" y1="8" x2="50" y2="50" stroke="#00ff41" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="66" y2="57" stroke="#00ff41" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="3" fill="#00ff41"/>
    <circle cx="50" cy="50" r="6" stroke="#00ff41" stroke-width=".8" opacity=".5"/>
    <line x1="50" y1="8" x2="50" y2="13" stroke="#004d18" stroke-width="1.5"/>
    <line x1="50" y1="87" x2="50" y2="92" stroke="#004d18" stroke-width="1.5"/>
    <line x1="8" y1="50" x2="13" y2="50" stroke="#004d18" stroke-width="1.5"/>
    <line x1="87" y1="50" x2="92" y2="50" stroke="#004d18" stroke-width="1.5"/>
  </svg>

  <p class="label">TIME CAPSULE</p>
  <h1 class="title">
    5B INF
    <span>ITIS QUINTINO SELLA</span>
  </h1>

  <div class="status">
    <span class="dot"></span>
    <span id="sys" aria-live="polite"></span>
  </div>

  <div class="timer-wrap">
    <div class="timer-disp">
      <div class="tu tu-y"><div class="td-wrap"><div class="scanline"></div><span class="td" id="dy">09</span></div><span class="tl" id="yl">ANNI</span></div>
      <span class="t-dot">·</span>
      <div class="tu tu-d"><div class="td-wrap"><div class="scanline"></div><span class="td" id="dd">364</span></div><span class="tl" id="dl">GIORNI</span></div>
      <span class="t-col">:</span>
      <div class="tu"><div class="td-wrap"><div class="scanline"></div><span class="td" id="dh">23</span></div><span class="tl" id="hl">ORE</span></div>
      <span class="t-col">:</span>
      <div class="tu"><div class="td-wrap"><div class="scanline"></div><span class="td" id="dm">59</span></div><span class="tl" id="ml">MINUTI</span></div>
      <span class="t-col">:</span>
      <div class="tu"><div class="td-wrap"><div class="scanline"></div><span class="td" id="ds2">59</span></div><span class="tl" id="sl">SECONDI</span></div>
    </div>
  </div>

  <p class="phrase" id="phrase">Il futuro si conserva nel codice.
Il passato si rivela al momento giusto.</p>

  <!-- Released notice — shown after zero, points to live site -->
  <!-- NO content is ever shown in this locked version -->
  <div class="released-notice" id="rn">
    ⬡ &nbsp;<span id="rn-text">VISITA IL SITO UFFICIALE PER L'ARCHIVIO COMPLETO</span>
  </div>
</main>

<script>
(function(){
'use strict';

/* ── CONFIG: only release date, NO content ── */
const RELEASE = new Date('2036-05-07T00:00:00Z');
const WORKER = 'https://tc-5b-inf.accessisoftwarefrancesco.workers.dev';

let lang = localStorage.getItem('tc-lang') || 'it';
let serverOffset = 0;

const TXT = {
  it: {
    label: 'TIME CAPSULE',
    years: 'ANNI', days: 'GIORNI', hours: 'ORE', min: 'MINUTI', sec: 'SECONDI',

    phrase: 'Il futuro si conserva nel codice.\nIl passato si rivela al momento giusto.',
    msg: ['⬡  CAPSULA SIGILLATA','⬡  ARCHIVIO BLOCCATO','⬡  RILASCIO IN ATTESA',
          '⬡  MEMORIA SINCRONIZZATA','⬡  ACCESSO PROGRAMMATO'],
    rn: 'VISITA IL SITO UFFICIALE PER L\'ARCHIVIO COMPLETO',
  },
  en: {
    label: 'TIME CAPSULE',
    years: 'YEARS', days: 'DAYS', hours: 'HOURS', min: 'MINUTES', sec: 'SECONDS',
    phrase: 'The future is preserved in code.\nThe past reveals itself at the right moment.',
    msg: ['⬡  CAPSULE SEALED','⬡  ARCHIVE LOCKED','⬡  RELEASE PENDING',
          '⬡  MEMORY SYNCHRONIZED','⬡  ACCESS SCHEDULED'],
    rn: 'VISIT THE OFFICIAL SITE FOR THE FULL ARCHIVE',
  }
};

function T(k) { return (TXT[lang]||TXT['it'])[k]; }

function setLang(l) {
  if (!TXT[l]) return;
  lang = l; localStorage.setItem('tc-lang', l);
  document.documentElement.lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === l);
  });
  document.getElementById('yl').textContent = T('years');
  document.getElementById('dl').textContent = T('days');
  document.getElementById('hl').textContent = T('hours');
  document.getElementById('ml').textContent = T('min');
  document.getElementById('sl').textContent = T('sec');
  document.getElementById('phrase').textContent = T('phrase');
  document.getElementById('rn-text').textContent = T('rn');
  restartMessages();
}

document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

/* Matrix — cinematic 10fps, white blinking head */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const CHARS = 'ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789ABCDEFZ:.|<>[]{}+-=*';
const CA = CHARS.split('');
const FS = 14;
let W, H, cols, drops;
function mkDrop() {
  return { y: -Math.floor(4 + Math.random()*35), speed: 0.55+Math.random()*0.85,
           length: 10+Math.floor(Math.random()*24), chars: [] };
}
function resize() {
  W = canvas.width = innerWidth; H = canvas.height = innerHeight;
  cols = Math.floor(W/FS); drops = Array.from({length:cols}, mkDrop);
}
resize();
window.addEventListener('resize', resize);
function rndCh() { return CA[Math.floor(Math.random()*CA.length)]; }
let frm=0, blinkOn=true, lastBlink=0;
function draw(ts) {
  frm++; requestAnimationFrame(draw);
  if (frm%6!==0) return;
  if (ts-lastBlink>90){blinkOn=!blinkOn;lastBlink=ts;}
  ctx.fillStyle='rgba(0,0,0,0.13)'; ctx.fillRect(0,0,W,H);
  ctx.font=`${FS}px 'Share Tech Mono',monospace`;
  for(let i=0;i<cols;i++){
    const d=drops[i], hRow=Math.floor(d.y), x=i*FS;
    for(let j=d.length;j>=1;j--){
      const py=(hRow-j)*FS; if(py<0||py>H)continue;
      const rel=j/d.length;
      let alpha,g;
      if(rel<0.18){g=255;alpha=0.88-rel*2.5;}
      else if(rel<0.42){g=210;alpha=0.55-(rel-0.18)*1.2;}
      else if(rel<0.68){g=130;alpha=0.24-(rel-0.42)*0.7;}
      else{g=55;alpha=0.07;}
      ctx.fillStyle=`rgba(0,${g},0,${alpha})`;
      if(!d.chars[j]||Math.random()<0.06)d.chars[j]=rndCh();
      ctx.fillText(d.chars[j],x,py);
    }
    const hy=hRow*FS;
    if(hy>=0&&hy<=H){
      d.chars[0]=rndCh();
      if(blinkOn){ctx.shadowColor='#ffffff';ctx.shadowBlur=12;ctx.fillStyle='#ffffff';}
      else{ctx.shadowColor='rgba(0,255,65,.9)';ctx.shadowBlur=7;ctx.fillStyle='rgba(180,255,180,.95)';}
      ctx.fillText(d.chars[0],x,hy); ctx.shadowBlur=0;
    }
    d.y+=d.speed;
    if((hRow-d.length)*FS>H)drops[i]=mkDrop();
  }
}
if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(draw);
else canvas.style.display='none';

/* Timer */
let releaseTs = RELEASE.getTime();
let done = false;
function now() { return Date.now() + serverOffset; }
function pad(n) { return String(Math.max(0,n)).padStart(2,'0'); }
function setD(id, v) {
  const el = document.getElementById(id);
  if (!el || el.textContent === v) return;
  el.textContent = v; el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick');
}
function tick() {
  const nowDate    = new Date(now());
  const relDate    = new Date(releaseTs);
  if (nowDate >= relDate) {
    setD('dy','00');setD('dd','000');setD('dh','00');setD('dm','00');setD('ds2','00');
    if (!done) { done=true; onReleased(); } return;
  }
  let years = relDate.getFullYear() - nowDate.getFullYear();
  const after = new Date(nowDate); after.setFullYear(after.getFullYear()+years);
  if (after > relDate) years = Math.max(0,years-1);
  const base = new Date(nowDate); base.setFullYear(base.getFullYear()+years);
  const remMs = Math.max(0, relDate - base);
  const ts = Math.floor(remMs/1000);
  const d = Math.floor(ts/86400), h = Math.floor((ts%86400)/3600);
  const m = Math.floor((ts%3600)/60), s = ts%60;
  setD('dy', String(Math.max(0,years)).padStart(2,'0'));
  setD('dd', String(d).padStart(3,'0'));
  setD('dh',pad(h)); setD('dm',pad(m)); setD('ds2',pad(s));
}
setInterval(tick, 1000); tick();

function onReleased() {
  document.body.classList.add('released');
  /* IMPORTANT: this locked version NEVER shows content.
     It only shows a notice to visit the real site. */
}

/* System messages */
let msgIdx = 0, msgTimer;
function restartMessages() { msgIdx = 0; }
function nextMsg() {
  const el = document.getElementById('sys');
  if (!el) return;
  el.style.opacity = '0';
  setTimeout(() => {
    el.textContent = T('msg')[msgIdx % T('msg').length];
    el.style.opacity = '1';
    msgIdx++;
  }, 320);
}
nextMsg();
msgTimer = setInterval(nextMsg, 3800);

/* Optional: sync with worker for accurate time */
if (WORKER) {
  fetch(`${WORKER}/api/status`, { cache: 'no-store', signal: AbortSignal.timeout(5000) })
    .then(r => r.json())
    .then(d => {
      serverOffset = d.serverTime - Date.now();
      releaseTs = d.releaseTimestamp;
    })
    .catch(() => {});
}

/* Init lang */
setLang(lang);
})();
</script>
</body>
</html>
